<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light">
  <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>特殊奖池二选一</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}

/* 舞台（固定2340x1080，JS动态缩放） */
.stage{position:relative;width:2340px;height:1080px;transform-origin:top left;overflow:hidden}

/* 背景层 */
.bg-layer{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}

/* 道具选择区域 */
.item-select-area{position:absolute;left:0;top:0;width:100%;height:100%;z-index:10}

/* 道具框 */
.item-box{position:absolute;width:500px;height:450px;top:300px;cursor:pointer;transition:all 0.3s ease;display:flex;align-items:center;justify-content:center}
.item-box.left{left:580px}
.item-box.right{left:1260px}

/* 道具图片 */
.item-img{width:350px;height:350px;object-fit:contain;transition:all 0.3s ease;pointer-events:none}

/* 道具名称 */
.item-name{position:absolute;bottom:-30px;left:0;width:100%;text-align:center;color:#fff;font-size:32px;font-weight:bold;text-shadow:0 2px 8px rgba(0,0,0,0.8);pointer-events:none}

/* 选中状态 - 发光效果 */
.item-box.selected{transform:scale(1.1)}
.item-box.selected .item-img{filter:drop-shadow(0 0 30px rgba(255,215,0,0.8)) drop-shadow(0 0 60px rgba(255,215,0,0.5))}
.item-box.selected::before{content:'';position:absolute;inset:-20px;border-radius:20px;box-shadow:0 0 30px rgba(255,215,0,0.6),inset 0 0 30px rgba(255,215,0,0.3);animation:pulse 1.5s ease-in-out infinite}

@keyframes pulse{
  0%,100%{opacity:0.6}
  50%{opacity:1}
}

/* 确定按钮（透明热区） */
.confirm-btn{position:absolute;left:40%;top:82%;width:20%;height:10%;background:transparent;border:none;cursor:pointer;z-index:100}
.confirm-btn:disabled{cursor:not-allowed}

/* 提示文字 */
.tip-text{position:absolute;top:180px;left:0;width:100%;text-align:center;color:#fff;font-size:48px;font-weight:bold;text-shadow:0 2px 10px rgba(0,0,0,0.9);pointer-events:none;z-index:20}
</style>
<style>

/* ===== 防止浏览器暗夜模式自动反转颜色 ===== */
:root {
  color-scheme: light only;
  -webkit-color-scheme: light only;
}
html {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
}
body {
  color-scheme: light only;
  -webkit-color-scheme: light only;
  background-color: #000 !important;
  -webkit-lightness-adjust: none !important;
}
/* 防止图片被反转 */
img {
  -webkit-filter: none !important;
  filter: none !important;
}
/* ============================================ */

</style>
  <script src="../data/item_base_name_map.js"></script>
  <script src="../data/showcase_items.js"></script>
  <script src="../data/item_mapping.js"></script>
  <script src="../data/item_box_config.js"></script>
</head>
<body>
<div class="stage" id="stage">
  <img class="bg-layer" id="bgImg" src="../images/common/bonus/extra/tip_bg.png" alt="特殊奖池二选一">
  
  <div class="item-select-area">
    <div class="item-box left" id="itemBoxLeft" data-side="B">
      <img class="item-img" id="itemImgLeft" src="" alt="B池奖励">
      <div class="item-name" id="itemNameLeft"></div>
    </div>
    <div class="item-box right" id="itemBoxRight" data-side="A">
      <img class="item-img" id="itemImgRight" src="" alt="A池奖励">
      <div class="item-name" id="itemNameRight"></div>
    </div>
  </div>
  
  <button class="confirm-btn" id="confirmBtn" disabled></button>
</div>

<script>
// ===== 预加载模式检查 =====
var isPreloadMode = false;
try {
  var urlParams = new URLSearchParams(window.location.search);
  isPreloadMode = urlParams.get('preload') === '1';
} catch(e){}
// 自适应缩放
function layout(){
  var s = Math.min(window.innerWidth/2340, window.innerHeight/1080);
  document.getElementById('stage').style.transform = 'scale('+s+')';
  document.getElementById('stage').style.left = (window.innerWidth - 2340*s)/2 + 'px';
  document.getElementById('stage').style.top = (window.innerHeight - 1080*s)/2 + 'px';
}
window.addEventListener('resize', layout);
layout();

// ===== 点击音效 =====
var clickAudioPool = [];
var clickAudioIndex = 0;
for(var i = 0; i < 5; i++){
  var ca = new Audio('../audio/gacha/click.m4a');
  ca.preload = 'auto';
  clickAudioPool.push(ca);
}
function playClickSound(){
  try{
    var audio = clickAudioPool[clickAudioIndex];
    clickAudioIndex = (clickAudioIndex + 1) % 5;
    audio.currentTime = 0;
    audio.play().catch(function(e){});
  }catch(e){}
}
// ===== 点击音效结束 =====

// A池和B池的奖励
var rewardA = null;
var rewardB = null;
var selectedSide = null; // 'A' 或 'B'

// 是否已确认标记，防止重复确认
var hasConfirmed = false;

// 道具图片映射（从父页面获取）
var itemMapping = {};

// 监听父页面的postMessage，接收A池和B池的奖励信息
window.addEventListener('message', function(e){
  if(e.data && e.data.type === 'setSpecialRewards'){
    rewardA = e.data.rewardA;
    rewardB = e.data.rewardB;
    itemMapping = e.data.itemMapping || {};
    
    // 盒子架构：从映射表读取有出货动画的道具列表，不硬编码
    var showcaseItems = window.SHOWCASE_ITEMS || [];
    
    // 特殊图片映射（B池中没有出货动画的道具，使用特殊图片显示）

    
    // 获取道具显示图片（盒子架构：从配置和映射表读取，不硬编码）
    // 获取道具显示图片（优先用itemMapping，兜底用父页面的getItemImage）
    function getSpecialItemImg(itemName){
      if(!itemName) return '';
      // 先去掉数量后缀
      var cleanName = itemName.replace(/[×*]\d+$/, '');
      // 用item_base_name_map转换名称（处理印花|兔兔战士 → 印花兔兔战士这种）
      if(window.ITEM_BASE_NAME_MAP && window.ITEM_BASE_NAME_MAP[cleanName]){
        cleanName = window.ITEM_BASE_NAME_MAP[cleanName];
      }
      // 判断是否有出货动画
      var hasShowcase = false;
      if(window.SHOWCASE_ITEMS){
        hasShowcase = window.SHOWCASE_ITEMS.indexOf(cleanName) !== -1;
      }else if(window.parent && window.parent.SHOWCASE_ITEMS){
        hasShowcase = window.parent.SHOWCASE_ITEMS.indexOf(cleanName) !== -1;
      }
      var imgType = hasShowcase ? 'showcase' : 'small';
      
      // 1. 优先从itemMapping读取（父页面已经传递过来了）
      if(itemMapping && itemMapping[cleanName] && itemMapping[cleanName].image){
        // itemMapping里的路径是images/items_box/...，需要换成对应的图片类型
        var imgPath = itemMapping[cleanName].image;
        // 把small.png换成对应的图片类型
        imgPath = imgPath.replace(/small\.png$/, imgType + '.png');
        return '../' + imgPath;
      }
      // 2. 兜底：用父页面的getItemImage函数
      if(window.parent && window.parent.getItemImage){
        return '../' + window.parent.getItemImage(itemName, imgType);
      }
      return '';
    }
    // 更新B池奖励显示（左边）
    if(rewardB){
      document.getElementById('itemNameLeft').textContent = rewardB.name;
      var imgB = getSpecialItemImg(rewardB.name);
      if(imgB){
        document.getElementById('itemImgLeft').src = imgB;
      }
    }
    
    // 更新A池奖励显示（右边）
    if(rewardA){
      document.getElementById('itemNameRight').textContent = rewardA.name;
      var imgA = getSpecialItemImg(rewardA.name);
      if(imgA){
        document.getElementById('itemImgRight').src = imgA;
      }
    }
  }
});

// 选择B池奖励（左边）
document.getElementById('itemBoxLeft').addEventListener('click', function(){
  playClickSound(); // 播放点击音效
  selectedSide = 'B';
  document.getElementById('itemBoxLeft').classList.add('selected');
  document.getElementById('itemBoxRight').classList.remove('selected');
  document.getElementById('confirmBtn').disabled = false;
});

// 选择A池奖励（右边）
document.getElementById('itemBoxRight').addEventListener('click', function(){
  playClickSound(); // 播放点击音效
  selectedSide = 'A';
  document.getElementById('itemBoxRight').classList.add('selected');
  document.getElementById('itemBoxLeft').classList.remove('selected');
  document.getElementById('confirmBtn').disabled = false;
});

// 确认函数
function doConfirm(){
  if(hasConfirmed) return;
  if(!selectedSide) return; // 必须先选择一个奖励
  hasConfirmed = true;
  
  var selectedReward = selectedSide === 'A' ? rewardA : rewardB;
  parent.postMessage({type: 'bonusTipConfirm', selectedReward: selectedReward, selectedSide: selectedSide}, '*');
}

// 确定按钮点击
document.getElementById('confirmBtn').addEventListener('click', function(){
  playClickSound(); // 播放点击音效
  doConfirm();
});

// 监听ESC键
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    // ESC键不做任何操作，必须选择奖励后点击确定
  }
});
</script>

<script>
// 禁止长按弹出菜单
document.addEventListener('contextmenu', function(e){
  e.preventDefault();
  return false;
});
// 禁止图片拖拽
document.addEventListener('dragstart', function(e){
  if(e.target.tagName === 'IMG'){
    e.preventDefault();
    return false;
  }
});
</script>
</body>
</html>
